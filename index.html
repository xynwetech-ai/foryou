<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>For You ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #f8c8d4;
    }

    body {
      color: #fff;
      font-family: 'Poppins', sans-serif;
      position: relative;
    }

    /* ===== BACKGROUND VIDEO (HD, no quality loss) ===== */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #f8c8d4;
      overflow: hidden;
    }

    .bg-layer video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      pointer-events: none;
      opacity: 0;              /* sembunyi dulu sampai tap */
      transition: opacity 1s ease;
      background: transparent;
    }

    .bg-layer video.ready {
      opacity: 1;
    }

    /* hilangkan kontrol bawaan browser */
    .bg-layer video::-webkit-media-controls,
    .bg-layer video::-webkit-media-controls-start-playback-button,
    .bg-layer video::-webkit-media-controls-enclosure {
      display: none !important;
      -webkit-appearance: none;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      /* overlay lebih tipis biar video kelihatan */
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.2) 100%);
      pointer-events: none;
    }

    /* ===== FALLING STAGE ===== */
    .falling-stage {
      position: fixed;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
    }

    /* ===== PHOTO ===== */
    .photo {
      position: absolute;
      border-radius: 10px;
      overflow: hidden;
      box-shadow:
        0 14px 36px rgba(0,0,0,0.55),
        0 0 0 1px rgba(255,255,255,0.07);
      background: #1a1a1a;
      will-change: transform, opacity;
      opacity: 0;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* ukuran bervariasi */
    .photo.s1 { width: 138px; height: 182px; }
    .photo.s2 { width: 158px; height: 208px; }
    .photo.s3 { width: 118px; height: 156px; }
    .photo.s4 { width: 172px; height: 226px; }
    .photo.s5 { width: 128px; height: 168px; }
    .photo.s6 { width: 148px; height: 196px; }
    .photo.s7 { width: 108px; height: 142px; }
    .photo.s8 { width: 162px; height: 212px; }
    .photo.s9 { width: 132px; height: 176px; }

    /* ===== TEXT ===== */
    .text-item {
      position: absolute;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: rgba(255, 255, 255, 0.82);
      text-shadow: 0 2px 14px rgba(0,0,0,0.65);
      white-space: nowrap;
      will-change: transform, opacity;
      opacity: 0;
      pointer-events: none;
      letter-spacing: 0.02em;
    }

    .text-item.t1 { font-size: 1.35rem; }
    .text-item.t2 { font-size: 1.1rem; }
    .text-item.t3 { font-size: 1.5rem; }
    .text-item.t4 { font-size: 1.05rem; }
    .text-item.t5 { font-size: 1.4rem; }
    .text-item.t6 { font-size: 1.2rem; }
    .text-item.t7 { font-size: 1.25rem; }
    .text-item.t8 { font-size: 1.15rem; }

    /* ===== CENTER TITLE ===== */
    .center-title {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      text-align: center;
      pointer-events: none;
      opacity: 0;
    }

    .center-title.show {
      animation: titleIn 2s ease forwards;
    }

    .center-title h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 7vw, 3.2rem);
      font-weight: 400;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.92);
      text-shadow: 0 4px 28px rgba(0,0,0,0.55);
    }

    .center-title p {
      margin-top: 0.4rem;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #e8b4bc;
      font-weight: 300;
    }

    @keyframes titleIn {
      from { opacity: 0; transform: translate(-50%, -46%); }
      to   { opacity: 1; transform: translate(-50%, -50%); }
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.5) 100%);
    }


  </style>
</head>
<body>

  <!-- Background video HD + suara -->
  <div class="bg-layer" id="bgLayer">
    <video
      id="bgVideo"
      src="assets/background.mp4"
      autoplay
      loop
      muted
      playsinline
      webkit-playsinline
      preload="auto"
      disablePictureInPicture
    ></video>
  </div>
  <div class="bg-overlay"></div>

  <div class="falling-stage" id="stage"></div>

  <div class="center-title" id="centerTitle">
    <h1>For You</h1>
    <p>karena kamu istimewa</p>
  </div>

  <div class="vignette"></div>
<script>
    // ========== DATA (ganti src foto di sini) ==========
    const photos = [
      { src: 'assets/img1.jpg', size: 's1', rot: -12 },
      { src: 'assets/img2.jpg', size: 's2', rot: 8 },
      { src: 'assets/img3.jpg', size: 's3', rot: -6 },
      { src: 'assets/img4.jpg', size: 's4', rot: 14 },
      { src: 'assets/img5.jpg', size: 's5', rot: -18 },
      { src: 'assets/img6.jpg', size: 's6', rot: 5 },
      { src: 'assets/img7.jpg', size: 's7', rot: -9 },
      { src: 'assets/img8.jpg', size: 's8', rot: 11 },
      { src: 'assets/img9.jpg', size: 's9', rot: -4 },
      { src: 'assets/img10.jpg', size: 's1', rot: 16 },
      { src: 'assets/img11.jpg', size: 's2', rot: -14 },
      { src: 'assets/img12.jpg', size: 's3', rot: 7 },
      { src: 'assets/img13.jpg', size: 's4', rot: -10 },
      { src: 'assets/img14.jpg', size: 's5', rot: 9 },
      { src: 'assets/img15.jpg', size: 's6', rot: -7 },
      { src: 'assets/img16.jpg', size: 's7', rot: 12 },
      { src: 'assets/img17.jpg', size: 's8', rot: -5 },
    ];

    const texts = [
      { text: 'loveee youuuu cintakuuuuu', cls: 't1', rot: -8 },
      { text: 'cantinaaaa',         cls: 't2', rot:  6 },
      { text: 'cantiiinaa kebangetann',       cls: 't3', rot: -4 },
      { text: 'alwayss lovee youuuuuu',     cls: 't4', rot: 10 },
      { text: 'you are enough',      cls: 't5', rot: -12 },
      { text: 'lovee youuu foreverrr',        cls: 't6', rot:  5 },
      { text: 'stay with me???',        cls: 't7', rot: -7 },
      { text: 'favv personnn',  cls: 't8', rot:  9 },
      { text: 'i so lovee youuuu',          cls: 't2', rot: -5 },
      { text: 'onlyyy youuuuu',            cls: 't4', rot:  8 },
      { text: 'forever us',          cls: 't1', rot: -10 },
      { text: 'samaa akuu teruss yaaaaa',         cls: 't6', rot:  4 },
      { text: 'with me foreverre',     cls: 't3', rot: -6 },
      { text: 'RAHULLLLLL',            cls: 't5', rot: 11 },
      { text: 'OHH YAAA BANGGGG',      cls: 't1', rot: -9 },
      { text: 'ehh koo cantiiii',        cls: 't7', rot: 7 },
      { text: 'loveee youuuuu cintakuuuu',            cls: 't8', rot: -3 },
      { text: 'all for youuuu',        cls: 't2', rot: 12 },
    ];

    const stage = document.getElementById('stage');
    const bgVideo = document.getElementById('bgVideo');

    // coba beberapa path umum kalau assets/background.mp4 tidak ketemu
    function ensureBgSrc() {
      if (!bgVideo) return;
      const candidates = [
        'assets/background.mp4',
        './assets/background.mp4',
        'background.mp4',
        './background.mp4'
      ];
      let i = 0;
      const tryNext = () => {
        if (i >= candidates.length) {
          console.warn('background.mp4 tidak ditemukan');
          return;
        }
        const url = candidates[i++];
        bgVideo.src = url;
        bgVideo.load();
      };
      bgVideo.addEventListener('error', tryNext);
      // kalau sudah error sebelumnya
      if (bgVideo.error) tryNext();
    }
    ensureBgSrc();


    // Coba play video + suara (beberapa browser butuh interaksi user)
    function tryPlayVideo() {
      if (!bgVideo) return;
      bgVideo.muted = false; // pastikan suara nyala
      bgVideo.volume = 1;
      const playPromise = bgVideo.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // Autoplay dengan suara diblokir → tampilkan tombol tap
          showTapToPlay();
        });
      }
    }

    function showTapToPlay() {
      if (document.getElementById('tapOverlay')) return;
      const overlay = document.createElement('div');
      overlay.id = 'tapOverlay';
      overlay.style.cssText = `
        position:fixed; inset:0; z-index:99;
        display:flex; align-items:center; justify-content:center;
        background:rgba(0,0,0,0.55); cursor:pointer;
        font-family:'Playfair Display',serif; font-size:1.3rem;
        color:#fff; letter-spacing:0.08em; text-align:center;
      `;
      overlay.innerHTML = '<div>tap anywhere to play ❤️</div>';
      overlay.addEventListener('click', () => {
        bgVideo.muted = false;
        bgVideo.volume = 1;
        bgVideo.play();
        overlay.remove();
      }, { once: true });
      document.body.appendChild(overlay);
    }

    // Mulai video begitu bisa
    // autoplay ditunda sampai user tap (lihat boot())

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    // zona kiri / tengah / kanan — biar tidak numpuk satu sisi
    const zones = [
      [4, 28],   // kiri
      [36, 58],  // tengah
      [62, 88],  // kanan
    ];
    let zoneBag = [];
    function nextZoneX() {
      if (zoneBag.length === 0) {
        zoneBag = [0, 1, 2].sort(() => Math.random() - 0.5);
      }
      const z = zones[zoneBag.pop()];
      return rand(z[0], z[1]);
    }

    function createFallingItem(el, duration, delay) {
      // ambil zona bergiliran (kiri/tengah/kanan campur)
      const startX  = nextZoneX();
      const startY  = rand(-30, -5);
      const endY    = rand(108, 140);
      const driftX  = rand(-16, 16);
      const rotStart = parseFloat(el.dataset.rot) || 0;
      const rotEnd   = rotStart + rand(-25, 25);

      el.style.left = startX + 'vw';
      el.style.top  = startY + 'vh';
      el.style.transform = `rotate(${rotStart}deg)`;
      el.style.opacity = '0';

      const anim = el.animate([
        {
          transform: `translate(0, 0) rotate(${rotStart}deg)`,
          opacity: 0
        },
        {
          transform: `translate(${driftX * 0.3}vw, 12vh) rotate(${rotStart + (rotEnd - rotStart) * 0.15}deg)`,
          opacity: 0.95,
          offset: 0.07
        },
        {
          transform: `translate(${driftX}vw, ${endY - startY}vh) rotate(${rotEnd}deg)`,
          opacity: 0.12
        }
      ], {
        duration: duration,
        delay: delay,
        easing: 'linear',
        fill: 'forwards'
      });

      anim.onfinish = () => {
        el.remove();
        // respawn agak cepat biar tetap dramatis
        setTimeout(() => {
          if (el.classList.contains('photo')) {
            spawnPhoto(el._data);
          } else {
            spawnText(el._data);
          }
        }, rand(1500, 2800));
      };
    }

    function spawnPhoto(data) {
      const div = document.createElement('div');
      div.className = `photo ${data.size}`;
      div.dataset.rot = data.rot;
      div._data = data;

      const img = document.createElement('img');
      img.src = data.src;
      img.alt = '';
      img.loading = 'lazy';
      div.appendChild(img);

      stage.appendChild(div);

      const duration = rand(14000, 20000);
      createFallingItem(div, duration, 0);
    }

    function spawnText(data) {
      const span = document.createElement('span');
      span.className = `text-item ${data.cls}`;
      span.dataset.rot = data.rot;
      span.textContent = data.text;
      span._data = data;

      stage.appendChild(span);

      const duration = rand(15000, 22000);
      createFallingItem(span, duration, 0);
    }

    // Spawn ±1.5 detik, boleh banyak, posisi lebih tengah
    function startFalling() {
      spawnPhoto(photos[0]);
      setTimeout(() => spawnText(texts[0]), 1200);

      let photoIdx = 1;
      let textIdx = 1;
      let toggle = true;

      function spawnNext() {
        if (toggle && photoIdx < photos.length) {
          spawnPhoto(photos[photoIdx]);
          photoIdx++;
        } else if (textIdx < texts.length) {
          spawnText(texts[textIdx]);
          textIdx++;
        } else if (photoIdx < photos.length) {
          spawnPhoto(photos[photoIdx]);
          photoIdx++;
        } else {
          // semua sudah keluar → acak terus biar tetap ramai & dramatis
          if (Math.random() > 0.4) {
            spawnPhoto(photos[Math.floor(Math.random() * photos.length)]);
          } else {
            spawnText(texts[Math.floor(Math.random() * texts.length)]);
          }
        }
        toggle = !toggle;
        setTimeout(spawnNext, rand(1300, 1700)); // ±1.5 detik
      }

      setTimeout(spawnNext, 2000);
    }

    // ===== LOVE BLAST (halus → isi layar → byarr) =====
    // Tap overlay pink + watermark, lalu fade halus ke video
    function boot() {
      const title = document.getElementById('centerTitle');
      let started = false;

      function startAll() {
        if (started) return;
        started = true;

        const tap = document.getElementById('tapOverlay');

        // play video dulu (masih di balik overlay)
        if (bgVideo) {
          bgVideo.muted = false;
          bgVideo.volume = 1;
          bgVideo.play().catch(() => {});
          // tampilkan video setelah play
          bgVideo.classList.add('ready');
        }

        // fade out overlay pink
        if (tap) {
          tap.style.opacity = '0';
          setTimeout(() => {
            tap.remove();
            // body kembali gelap lembut
            document.body.style.background = '#0a0a0a';
            const layer = document.getElementById('bgLayer');
            if (layer) layer.style.background = '#0a0a0a';
          }, 700);
        }

        if (title) title.classList.add('show');
        setTimeout(() => startFalling(), 500);
      }

      // pastikan video tidak kelihatan + tidak ada native play icon
      if (bgVideo) {
        try { bgVideo.pause(); } catch (e) {}
        bgVideo.muted = true;
        bgVideo.removeAttribute('controls');
        bgVideo.classList.remove('ready');
      }

      if (!document.getElementById('tapOverlay')) {
        const tap = document.createElement('div');
        tap.id = 'tapOverlay';
        tap.style.cssText = [
          'position:fixed',
          'inset:0',
          'z-index:200',
          'display:flex',
          'flex-direction:column',
          'align-items:center',
          'justify-content:center',
          'background:#f8c8d4',
          'cursor:pointer',
          'text-align:center',
          'opacity:0',
          'transition:opacity 0.7s ease'
        ].join(';');

        tap.innerHTML = `
          <div style="
            font-family:'Playfair Display',serif;
            font-size:clamp(1.15rem,4vw,1.45rem);
            color:#5a2a35;
            letter-spacing:0.14em;
            margin-bottom:1.25rem;
          ">tap anywhere to start ❤️</div>
          <div style="
            font-family:'Poppins',sans-serif;
            font-size:0.72rem;
            color:rgba(90,42,53,0.55);
            letter-spacing:0.06em;
            font-weight:300;
          ">Made with ♥️ by Kyandraa for cintakuuu</div>
        `;
        document.body.appendChild(tap);

        requestAnimationFrame(() => {
          requestAnimationFrame(() => { tap.style.opacity = '1'; });
        });

        const unlock = (e) => {
          e.preventDefault();
          startAll();
        };
        tap.addEventListener('click', unlock, { once: true });
        tap.addEventListener('touchend', unlock, { once: true });
      }
    }

    if (document.readyState === 'complete') boot();
    else window.addEventListener('load', boot);

  </script>
</body>
</html>
